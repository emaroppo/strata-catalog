# The catalog's own machine: the index, and the thing that serves bytes.
#
# Separate from the repository's docker-compose.yml on purpose. That one is a
# development stack — Label Studio, a throwaway Postgres, MinIO standing in
# for object storage. This is the deployment those stand in for, and the two
# should never be confused for each other.
#
# Garage is not here. It runs on this host already and owns its own data;
# bringing it under this file would mean this file could take it down.

services:
  catalog-db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      # Published because the desktop labels and trains against this index.
      - "${STRATA_DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${STRATA_DB_USER:-strata}
      - POSTGRES_PASSWORD=${STRATA_DB_PASSWORD:?set it in .env}
      - POSTGRES_DB=${STRATA_DB_NAME:-strata}
    volumes:
      - catalog-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STRATA_DB_USER:-strata}"]
      interval: 5s
      timeout: 3s
      retries: 10

  blobs:
    # Both, deliberately. A clone with no such image builds it, so nothing
    # here depends on a registry or on a prebuilt artifact. A host that
    # already has the image tagged this way uses it and skips the build —
    # which is what lets a machine that cannot reach Docker Hub run the
    # thing anyway, by having the image loaded from elsewhere.
    image: strata-blobs:latest
    build:
      # The strata-catalog repository's root.
      context: ../..
      dockerfile: deploy/catalog-host/Dockerfile
    restart: unless-stopped
    ports:
      - "${STRATA_SERVE_PORT:-8081}:8081"
    environment:
      # Which catalog comes from the file mounted below: its [catalog]
      # default is the one served. Pointing this host at another catalog is
      # changing that default and running `docker compose up -d blobs`.
      - STRATA_CONFIG=/config/config.toml
      # Credentials only from here on. The file names the index without its
      # password, and libpq reads it from PGPASSWORD.
      - PGPASSWORD=${STRATA_DB_PASSWORD:?set it in .env}
      - STRATA_BLOB_SECRET=${STRATA_BLOB_SECRET:?the labeller signs with this too}
      - STRATA_S3_ACCESS_KEY=${STRATA_S3_ACCESS_KEY:?}
      - STRATA_S3_SECRET_KEY=${STRATA_S3_SECRET_KEY:?}
    volumes:
      # Written from inside this network — catalog-db by service name, Garage
      # at host.docker.internal. bootstrap-env.sh makes it from the example;
      # without it docker mounts an empty directory and the server refuses.
      - ./config.toml:/config/config.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      catalog-db:
        condition: service_healthy

volumes:
  catalog-db:
