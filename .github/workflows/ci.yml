name: CI

on:
  push:
    branches: [main]
  pull_request:

# Until the strata packages are on an index, each job first builds the
# wheels of the ones this package depends on from their repositories
# (.github/sibling-wheels.sh) and resolves against dist/. --no-cache
# throughout, because every package is 0.1.0 and uv would otherwise hand
# back whatever it built for that version last time.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: .github/sibling-wheels.sh labels common
      - run: uv sync --no-cache --find-links dist --group dev --extra all
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: .github/sibling-wheels.sh labels common
      - run: uv sync --no-cache --find-links dist --group dev --extra all
      - run: uv run --no-sync pytest -q

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: .github/sibling-wheels.sh labels common
      - run: uv sync --no-cache --find-links dist --group dev --extra all
      - run: uv run --no-sync pyright

  # The claim "one schema, two dialects" is either tested on both or
  # untested. The local suite covers SQLite; this covers the other half.
  postgres:
    name: tests (postgres index)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
          POSTGRES_DB: strata
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: .github/sibling-wheels.sh labels common
      - run: uv sync --no-cache --find-links dist --group dev --extra postgres
      - run: uv run --no-sync pytest tests/test_postgres.py -q
        env:
          STRATA_TEST_DB: postgresql+psycopg://strata:strata@localhost:5432/strata

  # What keeps the package publishable on its own: its wheel is built and
  # installed alone into a fresh environment, with only what it declares,
  # and its tests run there. In a checkout everything is installed, so a
  # package quietly relying on one it does not declare passes every other
  # job; this is the job it fails.
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: .github/sibling-wheels.sh labels common
      - run: uv build --wheel --out-dir dist .
      - run: uv venv --python 3.13 standalone
      - name: install the package alone
        # set -f: the extras' brackets are not a glob.
        run: |
          set -f
          uv pip install --no-cache --python standalone/bin/python --find-links dist strata-catalog[test,serve,s3] httpx pytest
      - run: standalone/bin/python -m pytest -q tests
