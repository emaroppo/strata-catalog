[project]
name = "strata-catalog"
version = "0.1.0"
description = "The labelled data catalog: samples, storage, grouping, annotations, datasets"
requires-python = ">=3.13"
dependencies = [
    "strata-labels",
    "sqlalchemy>=2.0",
]

# Storage backends are optional: the local one needs nothing beyond the
# standard library, so a checkout stays runnable without a database or an
# object store.
[project.optional-dependencies]
s3 = ["boto3>=1.34"]
postgres = ["psycopg[binary]>=3.2"]

[tool.uv.sources]
strata-labels = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: no strata/__init__.py in any package, or they stop merging
packages = ["strata"]
