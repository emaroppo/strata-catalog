[project]
name = "strata-catalog"
version = "0.1.0"
description = "The labelled data catalog: samples, storage, grouping, annotations, datasets"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "strata-labels>=0.1,<0.2",
    # The migration plumbing and the entry-point resolver. Its migrations
    # extra is sqlalchemy and alembic, which this package needs anyway.
    "strata-common[migrations]>=0.1,<0.2",
    "sqlalchemy>=2.0",
    # Schema changes are migrations, not create_all: an existing database
    # never gains a column from metadata alone. See strata-catalog-migrate.
    "alembic>=1.13",
]

# Storage backends are optional: the local one needs nothing beyond the
# standard library, so a checkout stays runnable without a database or an
# object store.
[project.optional-dependencies]
s3 = ["boto3>=1.34"]
# Serving blobs over HTTP, so Label Studio can stop reading a local mount.
serve = ["fastapi>=0.110", "uvicorn>=0.29", "strata-common[service]>=0.1,<0.2"]
postgres = ["psycopg[binary]>=3.2"]
# The preparer conformance suite is importable by plugins so they can run
# the contract against their own converter. The only thing here needing pytest.
test = ["pytest>=8.0"]

# What this catalog can ingest, read from what is installed. A plugin
# registers here too; these names are reserved so one cannot replace them.
[project.entry-points."strata.sample_types"]
image = "strata.catalog.builtin_types:Image"
frames = "strata.catalog.builtin_types:Frames"
text = "strata.catalog.builtin_types:Text"

[project.scripts]
# Only importable with the serve extra; declared here so the container has a
# command rather than a python -c.
strata-blobs = "strata.catalog.serve:main"
# Alembic's commands over the migrations this package ships, so a catalog
# can be brought up to date from an installed wheel.
strata-catalog-migrate = "strata.catalog.schema_version:migrate"
# Looking after a catalog: what it holds, whether it is reachable, copying,
# merging, repacking. Standard library only, so the install stays thin.
strata-catalog = "strata.catalog.cli:main"

[tool.uv.sources]
strata-labels = { workspace = true }
strata-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: no strata/__init__.py in any package, or they stop merging
packages = ["strata"]
